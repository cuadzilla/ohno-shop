name: Deploy to GitHub Pages

on:
  # Rebuild whenever code is pushed to main
  push:
    branches: [main]
  # Rebuild when Sanity sends the "sanity-publish" signal (the webhook)
  repository_dispatch:
    types: [sanity-publish]
  # Lets you click "Run workflow" in the Actions tab to rebuild by hand
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If several publishes arrive close together, only build the latest one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Set these under Settings > Secrets and variables > Actions > Variables.
          # They are public values, so "Variables" is fine (no need for Secrets).
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
          SNIPCART_PUBLIC_KEY: ${{ vars.SNIPCART_PUBLIC_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
